configs:
  gathers-mirrors:
    content: |
      mirrors = ["http://gathers-mirror:5235"]

services:
  # Mirror is optional
  gathers-mirror:
    image: ghcr.io/morosanmihail/gathers-mirror:latest
    ports:
      - "5235:5235"
    volumes:
      - gathers-mirror-data:/home/app/.local/share/gathers/mirror:rw
    environment:
      - MIRROR_INTERVAL_HOURS=24
    restart: unless-stopped

  gathers-api:
    image: gathers-api:final
    ports:
      - "5234:5234"
    volumes:
      - gathers-data:/home/app/.local/share/gathers/:rw
    configs:
      - source: gathers-mirrors
        target: /home/app/.local/share/gathers/mirrors.toml
    environment:
      # Comma-separated list of systems to enable.
      # Valid values: scryfall, sql, riftbound-sql, pokemon-sql
      # Add "sql" for offline MTG (downloads AllPrintings.db on first start).
      # Add "pokemon-sql" for Pokémon TCG support.
      - GATHERS_SYSTEMS=scryfall, sql
      - STORAGE_DB_PATH=/home/app/.local/share/gathers/DB/storage.db
      - MTG_DB_PATH=/home/app/.local/share/gathers/DB/AllPrintings.db
      # Optional: enables bulk mode for the "scryfall" system. When set, it
      # downloads Scryfall's full "default_cards" bulk data file and queries
      # it locally instead of the live Scryfall API for most lookups,
      # refreshing it automatically roughly once a day. This avoids Scryfall
      # rate limits entirely for normal use (collection search in particular
      # hits this hard). Leave unset to keep the original always-live-API
      # behaviour. Must be a different file than MTG_DB_PATH -- they're
      # different formats and both may be in use if you also have "sql"
      # enabled.
      - SCRYFALL_BULK_DB_PATH=/home/app/.local/share/gathers/DB/ScryfallBulk.db
      #- RIFTBOUND_DB_PATH=/home/app/.local/share/gathers/DB/riftbound.db
      #- POKEMON_DB_PATH=/home/app/.local/share/gathers/DB/pokemon.db
    restart: unless-stopped

  gathers-webui2:
    image: gathers-webui2:patched
    ports:
      - "3001:3001"
    depends_on:
      - gathers-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  gathers-data:
  gathers-mirror-data:
